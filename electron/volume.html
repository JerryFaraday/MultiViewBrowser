<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src 'unsafe-inline'"
  /><title>窗口音量</title
  ><style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      background: #242424;
      color: #ddd;
      font:
        14px "Segoe UI",
        sans-serif;
      display: flex;
      align-items: center;
      flex-direction: column;
      gap: 9px;
      padding: 9px 0;
      border: 1px solid #444;
      border-radius: 6px;
      height: 100vh;
      overflow: hidden;
    }
    output {
      height: 18px;
    }
    input {
      writing-mode: vertical-lr;
      direction: rtl;
      width: 22px;
      height: 112px;
      margin: 0;
      accent-color: rgb(0, 135, 189);
    }</style
  ><output>100</output
  ><input
    aria-label="窗口音量"
    type="range"
    min="0"
    max="100"
    step="25"
    value="100"
  />
</html>
